name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
jobs:
  test:
    name: test (kubernetes ${{ matrix.kubernetes }})
    runs-on: build-only
    strategy:
      fail-fast: false
      matrix:
        # 37 turned the client models into pydantic; keep the last pre-pydantic major covered.
        kubernetes: ["36", "37"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run Ruff Format
        run: uv run ruff format --check .

      - name: Install kubernetes ${{ matrix.kubernetes }}
        run: uv pip install "kubernetes~=${{ matrix.kubernetes }}.0"

      - name: Run tests
        run: uv run --no-sync pytest
        env:
          K8S_CLIENT_MAJOR: ${{ matrix.kubernetes }}
